<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="以自己为中心，记录每一代家人，看清亲缘关系与彼此称呼。">
  <title>亲缘 · 把家人连在一起</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="relation.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-definitions" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-4v6H5a1.5 1.5 0 0 1-1.5-1.5z"/>
      <path d="M8 6.5V4H5v4.5"/>
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3"/><path d="M3.5 20v-2a5.5 5.5 0 0 1 11 0v2M16 5.5a3 3 0 0 1 0 5.8M17 14.5a5.5 5.5 0 0 1 3.5 5.1"/>
    </symbol>
    <symbol id="icon-up" viewBox="0 0 24 24">
      <path d="m6 14 6-6 6 6M12 8v11"/>
    </symbol>
    <symbol id="icon-down" viewBox="0 0 24 24">
      <path d="m6 10 6 6 6-6M12 5v11"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path d="M20.8 5.8a5.5 5.5 0 0 0-7.8 0L12 6.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="m14 5 5 5M4 20l3.5-.7L20 6.8 17.2 4 4.7 16.5z"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4 4L19 6"/>
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14m-5-5 5 5-5 5"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 3h6l1 4H8zM6 7l1 14h10l1-14M10 11v6M14 11v6"/>
    </symbol>
    <symbol id="icon-route" viewBox="0 0 24 24">
      <rect x="3" y="3" width="6" height="6" rx="2"/><rect x="15" y="15" width="6" height="6" rx="2"/>
      <path d="M9 6h4a4 4 0 0 1 4 4v5M6 9v4a4 4 0 0 0 4 4h5"/>
    </symbol>
  </svg>

  <div class="page-glow page-glow-one" aria-hidden="true"></div>
  <div class="page-glow page-glow-two" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./" aria-label="亲缘首页">
      <span class="brand-mark"><svg><use href="#icon-home"></use></svg></span>
      <span class="brand-name">亲缘</span>
      <span class="brand-tagline">把家人连在一起</span>
    </a>
    <div class="header-note">
      <span class="little-sun" aria-hidden="true"></span>
      从我出发，记住每一份牵挂
    </div>
  </header>

  <main class="main-content">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow"><span></span> OUR FAMILY, OUR STORY</p>
        <h1 id="page-title">家人，是彼此的<span>来处与归途。</span></h1>
        <p class="intro-copy">从“我”开始，向上记住来处，向下延续牵挂。</p>
      </div>
      <div class="intro-decoration" aria-hidden="true">
        <svg><use href="#icon-heart"></use></svg>
        <span>每一根连线<br>都是一份爱</span>
      </div>
    </section>

    <section class="workspace" aria-label="亲缘关系制作器">
      <div class="tree-panel">
        <div class="panel-heading">
          <div class="panel-title">
            <span class="title-icon"><svg><use href="#icon-users"></use></svg></span>
            <div>
              <h2>我的亲缘树</h2>
              <p id="family-count">从一个人，到一棵 family tree</p>
            </div>
          </div>
          <div class="tree-tools">
            <div class="tree-legend" aria-label="图谱方向说明">
              <span><i class="legend-dot ancestor-dot"></i>上一代</span>
              <span><i class="legend-dot descendant-dot"></i>下一代</span>
            </div>
            <button type="button" class="auto-layout-button" id="auto-layout-button" aria-label="自动整理亲属位置和连线">
              <svg><use href="#icon-route"></use></svg>自动理线
            </button>
            <button type="button" class="clear-tree-button" id="clear-tree-button" aria-label="清空所有角色">
              <svg><use href="#icon-trash"></use></svg>清空角色
            </button>
          </div>
        </div>

        <div class="tree-viewport" id="tree-viewport" tabindex="0" aria-label="亲缘树，滚轮缩放，横向拖拽卡片调整位置，拖动空白处移动画布，点击卡片查看详情">
          <div class="tree-canvas" id="tree-canvas">
            <div class="tree-zoom-layer" id="tree-zoom-layer">
              <svg class="tree-lines" id="tree-lines" aria-hidden="true"></svg>
              <div id="tree-nodes"></div>
            </div>
          </div>
          <div class="canvas-hint" id="canvas-hint">
            <svg><use href="#icon-arrow"></use></svg>
            拖卡片调位置 · 空白平移 · 滚轮缩放
            <span class="zoom-level" id="zoom-level">100%</span>
          </div>
        </div>
      </div>

      <aside class="details-panel" id="details-panel" aria-label="亲属详情">
        <div id="details-content"></div>
      </aside>
    </section>

    <footer class="page-footer">
      <p><svg><use href="#icon-heart"></use></svg>每一段关系，都值得被温柔地记住。</p>
      <span>数据仅保存在当前浏览器 · 无需联网</span>
    </footer>
  </main>

  <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="dialog-icon" aria-hidden="true"><svg><use href="#icon-trash"></use></svg></div>
    <h2 id="confirm-title">确认操作</h2>
    <p id="confirm-message"></p>
    <div class="dialog-actions">
      <button type="button" class="dialog-cancel" id="dialog-cancel">取消</button>
      <button type="button" class="dialog-confirm" id="dialog-confirm">确认</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请开启浏览器 JavaScript，以使用亲缘关系制作器。</p></noscript>
</body>
</html>
